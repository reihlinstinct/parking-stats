name: Recovered refresh dry run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovered-refresh-dry-run
  cancel-in-progress: false

jobs:
  synthetic-reducer:
    if: github.repository == 'reihlinstinct/parking-stats' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Run synthetic reducer only
        env:
          PYTHONPATH: src
        run: python scripts/recovered_refresh_dry_run.py
      - name: Verify tracked privacy boundary
        env:
          PYTHONPATH: src
        run: python -m parking_stats.privacy_scan .
